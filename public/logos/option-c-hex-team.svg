<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CadensIQ Hex Team logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="0.6" stop-color="#059669"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- hexagon = the organization holding everyone together -->
  <path d="M32 10 L51 21 L51 43 L32 54 L13 43 L13 21 Z" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" opacity="0.9"/>
  <!-- three people nodes -->
  <circle cx="32" cy="25" r="5" fill="#ffffff"/>
  <circle cx="23" cy="38" r="5" fill="#ffffff" opacity="0.85"/>
  <circle cx="41" cy="38" r="5" fill="#ffffff" opacity="0.85"/>
  <!-- connecting cadence tick -->
  <path d="M29 31 L26 34 M35 31 L38 34" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
</svg>
