<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CadensIQ Unity Ring logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="0.6" stop-color="#059669"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- three arcs = time, tasks, people — one unbroken workforce ring -->
  <path d="M32 12 A20 20 0 0 1 49.3 22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M52 28 A20 20 0 0 1 42 49" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M36 52 A20 20 0 0 1 14 40" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M12 34 A20 20 0 0 1 26 13.5" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <!-- center = the employee at the middle of it all -->
  <circle cx="32" cy="32" r="6.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2.6" fill="#059669"/>
</svg>
